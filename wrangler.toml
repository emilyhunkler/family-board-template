name = "family-board"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "family_board"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]

[ai]
binding = "AI"

[version_metadata]
binding = "CF_VERSION_METADATA"

# The test copy: its own board and its own database, so trying a change never touches real families.
# Deploy it with: npm run deploy:staging   (see RELEASING.md)
[env.staging]
name = "family-board-staging"
workers_dev = true

[env.staging.vars]
STAGE = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "family_board_staging"
# The test copy's own database, in the same Cloudflare account as the live board.
database_id = "419c1dd6-e938-4bfa-9a13-44deb093b84d"
migrations_dir = "migrations"

[env.staging.triggers]
crons = ["*/15 * * * *"]

[env.staging.ai]
binding = "AI"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"
