# Puts a change on the test copy (the Worker family-board-staging and its own database, family_board_staging).
# It never touches the live board or families' data. It runs by itself after every merge to main, and anyone
# with access can run it on any branch from the Actions tab ("Run workflow"), to try a pull request first.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare token that can edit Workers and D1 (see RELEASING.md)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the board lives in
#   STAGING_SETUP_CODE     the setup code for the test board (optional; only sent when it's set)
name: Deploy test copy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-test-copy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the Cloudflare secrets
        # Trims stray spaces or a line break that can sneak in when a secret is pasted.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]'); ACCOUNT=$(printf '%s' "$ACCOUNT" | tr -d '[:space:]')
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"; fi
          if [ -n "$ACCOUNT" ]; then echo "::add-mask::$ACCOUNT"; echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"; fi
      - name: Check the secrets are there
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          else
            echo "::notice::The Cloudflare secrets aren't set up yet, so the test copy wasn't updated."
          fi
      - name: Run the tests
        if: steps.ready.outputs.ok == 'true'
        run: npm test
      - run: npm install --no-audit --no-fund
        if: steps.ready.outputs.ok == 'true'
      - name: Set up the test database's tables
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env staging
      - name: Deploy the test board
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --env staging
      - name: Give the test board its setup code
        if: steps.ready.outputs.ok == 'true'
        env:
          SETUP_CODE: ${{ secrets.STAGING_SETUP_CODE }}
        run: |
          SETUP_CODE=$(printf '%s' "$SETUP_CODE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -n "$SETUP_CODE" ]; then
            printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE --env staging
          else
            echo "No STAGING_SETUP_CODE secret yet, so the test board keeps the code it has."
          fi
      - name: Note what went out
        if: steps.ready.outputs.ok == 'true'
        run: |
          echo "### Test copy updated" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA::7}\`. The live board was not touched." >> "$GITHUB_STEP_SUMMARY"
