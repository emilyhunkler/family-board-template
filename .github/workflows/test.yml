# Runs the board's tests on every pull request and on main, so a change that breaks something shows up red
# before it reaches a family. The tests use only Node's built-in tools, so nothing needs installing.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
